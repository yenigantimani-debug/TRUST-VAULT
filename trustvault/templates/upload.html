{% extends "base.html" %}{% block title %}Upload{% endblock %}{% block body %}
<div class="pagehead"><div><p class="eyebrow">NEW</p><h1>Upload Document</h1><p class="sub">PDF, Office, image, TXT or CSV · 10 MB max. You choose who can access it next.</p></div></div>
<div class="card"><form method="post" enctype="multipart/form-data" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field"><label for="t">Title</label><input id="t" name="title" required maxlength="150"></div>
<div class="field"><label for="c">Category</label><select id="c" name="category">{% for c in CATEGORIES %}<option>{{ c }}</option>{% endfor %}</select></div>
<div class="field"><label for="d">Description</label><textarea id="d" name="description" maxlength="1000"></textarea></div>
<div class="field"><label for="f">File</label><input id="f" type="file" name="file" required></div>
<div><button class="btn primary">Upload</button></div></form></div>{% endblock %}
