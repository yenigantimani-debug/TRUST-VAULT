{% extends "_auth.html" %}{% block title %}Register{% endblock %}
{% block form %}<h2>Create account</h2><p class="sub">Owners upload and share. Viewers read what is shared with them.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field"><label for="u">Username</label><input id="u" name="username" required minlength="3" maxlength="32" autocomplete="username"></div>
<div class="field"><label for="e">Email</label><input id="e" type="email" name="email" required maxlength="320" autocomplete="email"></div>
<div class="field"><label for="r">Account type</label><select id="r" name="role"><option value="owner">Owner — upload &amp; share documents</option><option value="viewer">Viewer — read shared documents</option></select></div>
<div class="field"><label for="p">Password (10+ characters)</label><input id="p" type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></div>
<div class="field"><label for="p2">Confirm password</label><input id="p2" type="password" name="password2" required minlength="10" maxlength="128" autocomplete="new-password"></div>
<button class="btn primary">Create account</button></form>
<p class="auth-bottom">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>{% endblock %}
