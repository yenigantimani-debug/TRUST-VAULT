{% extends "base.html" %}{% from "_doctable.html" import table %}{% block title %}Search{% endblock %}{% block body %}
<div class="pagehead"><div><p class="eyebrow">FIND</p><h1>Search Documents</h1><p class="sub">Results include only documents you can access.</p></div></div>
<div class="card"><form method="get" class="filters">
<div class="field"><label for="q">Name</label><input id="q" name="q" value="{{ q.q }}"></div>
<div class="field"><label for="c">Category</label><select id="c" name="category"><option value="">All</option>{% for c in CATEGORIES %}<option {{ 'selected' if q.category==c }}>{{ c }}</option>{% endfor %}</select></div>
<div class="field"><label for="o">Owner</label><input id="o" name="owner" value="{{ q.owner }}"></div>
<div class="field"><label for="f">From</label><input id="f" type="date" name="date_from" value="{{ q.date_from }}"></div>
<div class="field"><label for="t">To</label><input id="t" type="date" name="date_to" value="{{ q.date_to }}"></div>
<button class="btn primary">Search</button></form>{{ table(rows) }}</div>{% endblock %}
