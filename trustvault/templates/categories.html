{% extends "base.html" %}{% block title %}Categories{% endblock %}{% block body %}
<div class="pagehead"><div><p class="eyebrow">ORGANISE</p><h1>Categories</h1><p class="sub">Counts include only documents you can access.</p></div></div>
<div class="grid category-grid">{% for c in CATEGORIES %}<a class="card category-card" href="{{ url_for('search', category=c) }}"><div class="stat-icon">◫</div><h2>{{ c }}</h2><p>{{ counts.get(c,0) }} document{{ '' if counts.get(c,0)==1 else 's' }}</p></a>{% endfor %}</div>{% endblock %}
