{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block body %}
<div class="pagehead"><div><p class="eyebrow">ACCOUNT</p><h1>Profile</h1><p class="sub">{{ me.username }} · {{ me.email }} · {{ me.role }}</p></div></div>
<div class="card"><h2>Change password</h2><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
<div class="field"><label>New password (10+ characters)</label><input type="password" name="new" required minlength="10" maxlength="128" autocomplete="new-password"></div>
<div class="field"><label>Confirm new password</label><input type="password" name="new2" required minlength="10" maxlength="128" autocomplete="new-password"></div>
<div><button class="btn primary">Update password</button></div></form></div>{% endblock %}
